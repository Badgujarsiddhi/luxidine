<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LuxeDine - Restaurant Ordering Chatbot</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="bg-overlay"></div>
    <div class="chatbot-container">
        <header class="chat-header">
            <div class="header-info">
                <div class="bot-avatar">
                    <div class="online-indicator"></div>
                    <img src="https://ui-avatars.com/api/?name=Luxe+Dine&background=ffd700&color=000" alt="Bot Avatar">
                </div>
                <div class="header-texts">
                    <h1>LuxeDine Assistant</h1>
                    <p>Always at your service</p>
                </div>
            </div>
            <button class="menu-btn" id="menuBtn">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </header>

        <main class="chat-messages" id="chatMessages">
            <div class="message bot">
                <div class="message-content">
                    <p>Welcome to <strong>LuxeDine</strong>! I'm your virtual assistant. How can I delight you today?</p>
                </div>
                <span class="timestamp">Just now</span>
            </div>
        </main>

        <footer class="chat-input-area">
            <div class="input-wrapper">
                <input type="text" id="userInput" placeholder="Type your request here..." autocomplete="off">
                <button id="sendBtn" class="send-btn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </div>
        </footer>
    </div>

    <script src="script.js?v=1.1"></script>
</body>
</html>
